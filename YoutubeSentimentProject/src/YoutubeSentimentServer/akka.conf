akka {
  loglevel = INFO
  stdout-loglevel = INFO
  log-config-on-start = off
  actor {
    provider = local
  }
}

coordinator-dispatcher {
  type = Dispatcher
  throughput = 30
}

video-dispatcher {
  type = ForkJoinDispatcher
  throughput = 5
  dedicated-thread-pool {
    thread-count = 4
    threadtype = background
  }
}